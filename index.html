<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>温蒂公主的侍卫 · 像素动画歌词MV</title>
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="stage" width="320" height="180" aria-label="温蒂公主的侍卫 像素动画MV"></canvas>
    <div id="vignette"></div>
    <div id="intro" class="show">
      <div class="intro-glow"></div>
      <div class="intro-inner">
        <div class="orn">✦ ─────────── ✦</div>
        <h1>温蒂公主的侍卫</h1>
        <p class="sub">告五人 ·《运气来得若有似无》</p>
        <button id="startBtn" type="button"><span>▶</span> 开始播放</button>
        <p class="hint">像素动画歌词 MV · 建议全屏 · 戴上耳机</p>
        <p class="keys">空格 播放 / 暂停 · ← → 快退快进 · M 静音 · F 全屏</p>
      </div>
    </div>
    <div id="hud">
      <button id="playBtn" class="ctl" type="button" title="播放/暂停 (空格)">❚❚</button>
      <div id="seekWrap">
        <div id="seekBar">
          <div id="seekMarks"></div>
          <div id="seekFill"></div>
          <div id="seekKnob"></div>
        </div>
      </div>
      <span id="timeLabel">0:00 / 4:17</span>
      <button id="muteBtn" class="ctl" type="button" title="静音 (M)">♪</button>
      <button id="fsBtn" class="ctl" type="button" title="全屏 (F)">⛶</button>
    </div>
    <div id="toast"></div>
  </div>
</div>
<audio id="bgm" src="song.mp3" preload="auto"></audio>
<script src="js/energy.js"></script>
<script src="js/util.js"></script>
<script src="js/palette.js"></script>
<script src="js/text.js"></script>
<script src="js/stage.js"></script>
<script src="js/chars.js"></script>
<script src="js/props.js"></script>
<script src="js/fx.js"></script>
<script src="js/scenes.js"></script>
<script src="js/director.js"></script>
<script src="js/main.js"></script>
</body>
</html>
